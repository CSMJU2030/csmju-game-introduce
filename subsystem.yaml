# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json
# ห้ามใส่บัญชีหรือรหัสผ่านในไฟล์นี้ (ถ้ามี test_accounts conformance จะตก) — บัญชีทดสอบอยู่ในไฟล์นอก repo
# ที่ CONFORMANCE_ACCOUNTS_FILE ชี้ ดู standards/docs/conformance.md ข้อ 2.1

name: csmju-game-introduce          # a-z 0-9 คั่นด้วย - ไม่เกิน 64 ตัว · ตรงกับทะเบียนใน Core Hub, SUBSYSTEM_ID และ data.service ของ /api/health
# เวอร์ชัน standards อยู่ใน .standards-version ไฟล์เดียว (ตั้งแต่ 1.5.1) — ไม่ต้องใส่ที่นี่
conformance_level: L3                 # L1 · L2 · L3 (ระบบที่มี UI ต้องถึง L3)

# frontend เป็นประตูเดียวของระบบ: proxy /api/* และ /auth/login /auth/callback /auth/logout ไป backend
base_url: https://csmju-game-introduce.jowave.com
core_hub_url: https://csmju2030.jowave.com
core_hub_web_url: https://csmju2030.jowave.com
callback_path: /auth/callback         # base_url + callback_path ต้องตรงกับ Callback URL ที่ลงทะเบียนไว้

# endpoint ที่เรียกได้โดยไม่มี token (SSO 1.1) — conformance ยิงทุกตัวนี้แบบไม่มี token
public_endpoints:
  - GET /api/health
  - GET /auth/login
  - GET /auth/callback
  - POST /auth/logout

# Gameplay business API probes must be added when that API is implemented.
# No placeholder endpoints: current backend provides auth and health only.

owners:
  pl: "@csmju2030/pl-game-introduce"
  aie: "@csmju2030/aie-game-introduce"
display_name: 'CSMJU Quest: Digital Campus Adventure'
repo: github.com/CSMJU2030/csmju-game-introduce
status: proposed
