<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CSMJU Quest · Digital Campus</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#244c35}#unity-container{position:fixed;inset:0}#unity-canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#fff;background:#16372c;font:16px system-ui;gap:18px}progress{width:240px;accent-color:#e9bf6b}#fullscreen{position:absolute;right:16px;bottom:16px;border:1px solid #ffffff44;border-radius:8px;background:#16372cbb;color:white;padding:8px 12px;cursor:pointer}#error{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-sizing:border-box;width:min(680px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;padding:24px;border-radius:12px;color:white;background:#632d2d;font:16px system-ui}#error pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:35vh;overflow:auto;font:13px monospace}#error button{padding:12px 24px;border:0;border-radius:6px;cursor:pointer}
@font-face{font-family:TAGameBoy;src:url('Prompt-Regular.ttf') format('truetype')}body,button,#loading,#error,#error pre{font-family:TAGameBoy,sans-serif;text-shadow:-1px 0 #000,1px 0 #000,0 -1px #000,0 1px #000}
</style></head><body><div id="unity-container"><canvas id="unity-canvas" tabindex="0"></canvas><div id="loading"><strong>CSMJU QUEST</strong><span>กำลังเข้าสู่มหาวิทยาลัย…</span><progress max="1" value="0"></progress></div><button id="fullscreen" title="เต็มหน้าจอ">⛶</button><div id="error"></div></div>
<script>
const canvas=document.querySelector('#unity-canvas');
const config={dataUrl:'Build/aca99ef261f4ca25889e24624e186d97.data.unityweb',frameworkUrl:'Build/campus.framework.js',codeUrl:'Build/65878c5e3b0c9dac2b6d9a327efd5c12.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'CSMJU2030',productName:'CSMJU Quest Digital Campus Adventure',productVersion:'1.8.0',devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),matchWebGLToCanvasSize:true,fullscreenElementID:'unity-container',cacheControl:()=>'no-store'};
function showLoadError(error){
 console.error('Campus load failed',error);
 document.querySelector('#loading').style.display='none';
 const el=document.querySelector('#error');el.replaceChildren();
 const heading=document.createElement('h2');heading.textContent='โหลดเกมไม่สำเร็จ';
 const message=document.createElement('p');message.textContent='ลองโหลดเกมรุ่นล่าสุดอีกครั้ง หากยังพบปัญหา ส่งรายละเอียดด้านล่างมาได้ครับ';
 const details=document.createElement('pre');details.textContent=String(error)+'\nBuild: 1.8.0';
 const retry=document.createElement('button');retry.textContent='โหลดเกมใหม่';retry.onclick=()=>{const url=new URL(location.href);url.searchParams.set('reload',Date.now());location.replace(url.href)};
 el.append(heading,message,details,retry);el.style.display='block';
}
const script=document.createElement('script');script.src='Build/f2a056d564b065339232d1a268dbd418.loader.js';script.onload=()=>createUnityInstance(canvas,config,p=>document.querySelector('progress').value=p).then(instance=>{window.campusGame=instance;document.querySelector('#loading').style.display='none';canvas.focus();document.querySelector('#fullscreen').onclick=()=>instance.SetFullscreen(1)}).catch(showLoadError);script.onerror=()=>showLoadError('ดาวน์โหลดตัวโหลดเกมไม่สำเร็จ');document.body.appendChild(script);
</script></body></html>
